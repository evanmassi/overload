<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14181A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Overload</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-180.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <h1 class="brand">Over<span>&middot;</span>load</h1>
  </div>
  <nav class="tabs" id="tabs" role="tablist">
    <button class="tab" role="tab" data-view="log" aria-selected="true">Log</button>
    <button class="tab" role="tab" data-view="history" aria-selected="false">History</button>
    <button class="tab" role="tab" data-view="progress" aria-selected="false">Progress</button>
  </nav>
</header>

<main class="wrap" id="main"></main>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-back" id="sheetback"></div>
  <div class="sheet-panel">
    <div class="sheet-head"><b id="sheettitle">Swap exercise</b><button id="sheetclose">Close</button></div>
    <div class="sheet-body" id="sheetbody"></div>
  </div>
</div>

<div class="savebar">
  <div class="savebar-in">
    <div class="ring" id="ring" aria-hidden="true">
      <svg viewBox="0 0 36 36"><circle class="ring-track" cx="18" cy="18" r="15.5"/><circle class="ring-fill" id="ringfill" cx="18" cy="18" r="15.5"/></svg>
      <span id="ringtext">0</span>
    </div>
    <div class="stat"><b id="volume">0</b><span id="volnote">no sets logged</span></div>
    <button class="timer" id="timer"><small>rest</small><span id="clock">90s</span></button>
    <div class="status" id="status"></div>
  </div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
