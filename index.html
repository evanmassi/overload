<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14181A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-180.png">
<title>Overload</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#E8EAEB; --surface:#FFFFFF; --surface-2:#F2F4F5; --sunk:#DFE3E5;
  --ink:#14181A; --muted:#5F696E; --faint:#8D959A; --line:#D0D6D9;
  --accent:#A93F16; --accent-ink:#FFFFFF; --accent-soft:#F6E7DF;
  --up:#176B45; --up-soft:#E0F0E7; --flat:#8A6A12; --flat-soft:#F5EDD8;
  --shadow:0 1px 2px rgba(20,24,26,.06),0 8px 24px rgba(20,24,26,.05);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0F1214; --surface:#191D1F; --surface-2:#212629; --sunk:#0B0E0F;
    --ink:#E7EAEB; --muted:#9AA3A8; --faint:#6C767B; --line:#2B3134;
    --accent:#E0743E; --accent-ink:#17110C; --accent-soft:#33231A;
    --up:#4CB884; --up-soft:#163024; --flat:#D3A43B; --flat-soft:#302713;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0F1214; --surface:#191D1F; --surface-2:#212629; --sunk:#0B0E0F;
  --ink:#E7EAEB; --muted:#9AA3A8; --faint:#6C767B; --line:#2B3134;
  --accent:#E0743E; --accent-ink:#17110C; --accent-soft:#33231A;
  --up:#4CB884; --up-soft:#163024; --flat:#D3A43B; --flat-soft:#302713;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
:root{color-scheme:light}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:Lato,system-ui,-apple-system,sans-serif;
  font-size:15px; line-height:1.45; -webkit-text-size-adjust:100%;
  padding-bottom:96px;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{
  max-width:640px;margin:0 auto;
  padding:0 calc(14px + env(safe-area-inset-right)) 0 calc(14px + env(safe-area-inset-left));
}

.topbar{
  position:sticky;top:0;z-index:20;background:var(--surface);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
.topbar-in{display:flex;align-items:center;gap:10px;padding:10px 14px 0;max-width:640px;margin:0 auto}
.brand{
  font-family:Lato,system-ui,-apple-system,sans-serif;font-weight:900;font-size:17px;
  letter-spacing:-.015em;margin:0;flex:1;
}
.brand span{color:var(--accent)}
.chip{
  font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;
  padding:5px 9px;border-radius:6px;background:var(--surface-2);
  border:1px solid var(--line);color:var(--muted);letter-spacing:.04em;
}
.chip.live{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.tabs{display:flex;gap:2px;padding:10px 14px 0;max-width:640px;margin:0 auto}
.tab{
  flex:1;padding:9px 4px 10px;border-radius:8px 8px 0 0;font-size:13px;font-weight:600;
  color:var(--muted);border-bottom:2px solid transparent;text-align:center;
  font-family:Lato,system-ui,-apple-system,sans-serif;letter-spacing:.01em;
}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);background:var(--surface-2)}
.tab small{display:block;font-family:"IBM Plex Mono",monospace;font-weight:400;font-size:10px;color:var(--faint);letter-spacing:.06em}
.tab[aria-selected="true"] small{color:var(--accent)}

.daybar{display:flex;align-items:center;gap:8px;padding:12px 0 4px}
.date-input{
  background:var(--surface);border:1px solid var(--line);border-radius:8px;
  padding:7px 9px;font-family:"IBM Plex Mono",monospace;font-size:13px;flex:1;min-width:0;
}
.blockset{display:flex;gap:3px;background:var(--sunk);padding:3px;border-radius:9px}
.blockset button{
  width:36px;padding:8px 0;border-radius:7px;font-family:Lato,system-ui,-apple-system,sans-serif;
  font-weight:900;font-size:14px;color:var(--muted);line-height:1;
}
.blockset button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}
.blockset.sessions{margin-top:8px}
.blockset.sessions button{
  position:relative;flex:1;width:auto;height:50px;padding:0;
  font-size:15px;font-weight:700;letter-spacing:-.005em;line-height:1;
  display:flex;align-items:center;justify-content:center;
}
.blockset.sessions small{
  position:absolute;left:0;right:0;bottom:5px;text-align:center;
  font-family:"IBM Plex Mono",monospace;font-size:8.5px;font-weight:600;
  letter-spacing:.12em;text-transform:uppercase;color:var(--accent);line-height:1;
  pointer-events:none;
}

.dayhead{padding:14px 0 6px}
.eyebrow{
  font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint);margin:0 0 3px;
}
.dayhead h2{
  font-family:Lato,system-ui,-apple-system,sans-serif;font-weight:900;font-size:27px;
  letter-spacing:-.02em;margin:0;text-wrap:balance;
}
.dayhead p{margin:5px 0 0;color:var(--muted);font-size:13.5px}

.ex{
  background:var(--surface);border:1px solid var(--line);border-radius:12px;
  margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow);
}
.ex-head{display:flex;align-items:center;gap:9px;padding:13px 13px 8px}
.ex-num{
  font-family:"IBM Plex Mono",monospace;font-size:11.5px;font-weight:600;
  color:var(--accent);letter-spacing:.04em;font-variant-numeric:tabular-nums;
  flex:none;
}
.ex-name{
  font-family:Lato,system-ui,-apple-system,sans-serif;font-weight:700;font-size:16.5px;
  letter-spacing:-.01em;flex:1;margin:0;line-height:1.25;min-width:0;
}
.meta{
  display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:0 13px 10px;
  font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);
  letter-spacing:.02em;font-variant-numeric:tabular-nums;
}
.meta .dot{color:var(--faint)}
.ex-cue{padding:0 13px 10px;margin:0;font-size:12.5px;color:var(--faint)}
.sets{padding:0 13px 11px;display:flex;flex-direction:column;gap:7px}
.set{
  display:grid;grid-template-columns:22px 1fr 14px 1fr 46px;align-items:center;gap:7px;
}
.set.head{gap:7px}
.set.head div{
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--faint);text-align:center;white-space:nowrap;
}
.superset{
  display:flex;align-items:center;gap:8px;padding:10px 13px 2px;
}
.superset b{
  font-family:Lato,system-ui,-apple-system,sans-serif;font-size:12px;font-weight:700;letter-spacing:.02em;
  color:var(--accent);
}
.superset span{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--faint);
  letter-spacing:.08em;text-transform:uppercase;
}
.ex.core .ex-head{padding-top:8px}
.ex.core .rule{height:1px;background:var(--line);margin:4px 13px 0}
.set-n{
  font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--faint);
  text-align:center;font-variant-numeric:tabular-nums;
}
.set-n.done{color:var(--accent);font-weight:600}
.set input{
  width:100%;min-height:42px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:8px;padding:0 9px;text-align:center;
  font-family:"IBM Plex Mono",monospace;font-size:16px;font-weight:500;
  font-variant-numeric:tabular-nums;
}
.set input::placeholder{color:var(--faint);font-weight:400}
.set input:focus{border-color:var(--accent);background:var(--surface)}
.set input.filled{border-color:var(--accent);background:var(--surface)}
.x{text-align:center;color:var(--faint);font-size:12px}
.delta{
  font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;
  text-align:center;padding:4px 0;border-radius:5px;letter-spacing:.02em;
}
.delta.up{background:var(--up-soft);color:var(--up)}
.delta.same{background:var(--flat-soft);color:var(--flat)}
.delta.down{color:var(--faint)}
.delta.none{color:var(--faint);font-size:10px}

.savebar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);
  border-top:1px solid var(--line);
  padding:9px calc(14px + env(safe-area-inset-right)) calc(9px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));
}
.savebar-in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px}
.stat{flex:1;min-width:0}
.stat b{
  display:block;font-family:"IBM Plex Mono",monospace;font-size:15px;font-weight:600;
  font-variant-numeric:tabular-nums;line-height:1.2;
}
.stat span{font-size:11px;color:var(--faint);letter-spacing:.03em}
.timer{
  font-family:"IBM Plex Mono",monospace;font-size:14px;font-weight:600;
  background:var(--surface-2);border:1px solid var(--line);border-radius:9px;
  padding:5px 12px 6px;min-width:78px;font-variant-numeric:tabular-nums;
  display:flex;flex-direction:column;align-items:center;line-height:1.2;
}
.timer small{
  font-size:9px;font-weight:400;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);
}
.timer.running{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.timer.running small{color:var(--accent-ink);opacity:.75}
.status{font-size:11px;color:var(--faint);font-family:"IBM Plex Mono",monospace;text-align:right;white-space:nowrap}
.status.saving{color:var(--accent)}

.hist-day{
  background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:12px 13px;margin-bottom:9px;box-shadow:var(--shadow);
}
.hist-top{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.hist-top h3{font-family:Lato,system-ui,-apple-system,sans-serif;font-size:14.5px;font-weight:600;margin:0;flex:1;letter-spacing:-.01em}
.hist-top .chip{padding:3px 7px}
.hist-line{
  display:flex;justify-content:space-between;gap:10px;font-size:13px;
  padding:3px 0;border-top:1px dashed var(--line);
}
.hist-line:first-of-type{border-top:none}
.hist-line span{color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-line b{font-family:"IBM Plex Mono",monospace;font-weight:500;font-variant-numeric:tabular-nums;font-size:12.5px}

.prog{
  background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:11px 13px;margin-bottom:8px;box-shadow:var(--shadow);
  display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;
}
.prog h3{font-family:Lato,system-ui,-apple-system,sans-serif;font-size:14.5px;font-weight:600;margin:0;letter-spacing:-.01em}
.prog .best{
  font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600;
  font-variant-numeric:tabular-nums;text-align:right;
}
.prog .meta{font-size:11.5px;color:var(--faint);font-family:"IBM Plex Mono",monospace}
.prog svg{grid-column:1/-1;width:100%;height:36px;margin-top:4px;overflow:visible}

.empty{
  text-align:center;color:var(--faint);padding:44px 20px;font-size:13.5px;
}
.legend{
  display:flex;flex-wrap:wrap;align-items:center;gap:7px 16px;padding:4px 0 14px;
  font-size:11.5px;color:var(--muted);
}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend em{
  font-style:normal;font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;
  padding:2px 6px;border-radius:5px;min-width:20px;text-align:center;
}
.legend em.up{background:var(--up-soft);color:var(--up)}
.legend em.same{background:var(--flat-soft);color:var(--flat)}
.legend em.ghost{color:var(--faint);border:1px dashed var(--line)}
.section-label{
  font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--accent);margin:16px 0 8px;
}
.eyebrow b{color:var(--accent);font-weight:600}
.blockset.sessions small.done{color:var(--accent)}
.backup{
  display:flex;gap:8px;padding:14px 0 4px;
}
.btn{
  flex:1;text-align:center;background:var(--surface);border:1px solid var(--line);
  border-radius:9px;padding:11px 10px;font-size:13px;font-weight:600;
  font-family:Lato,system-ui,-apple-system,sans-serif;color:var(--muted);cursor:pointer;
  box-shadow:var(--shadow);
}
.btn:active{background:var(--surface-2)}
.backup-note{
  font-size:11.5px;color:var(--faint);font-family:"IBM Plex Mono",monospace;
  padding:6px 0 0;margin:0;text-align:center;
}
.ex-name{cursor:pointer}
.ex-name::after{
  content:"?";font-family:"IBM Plex Mono",monospace;font-size:9px;font-weight:600;
  color:var(--accent);border:1px solid var(--accent);border-radius:50%;
  width:14px;height:14px;display:inline-flex;align-items:center;justify-content:center;
  margin-left:6px;vertical-align:middle;opacity:.65;
}
.howto-steps{margin:0;padding:0 0 0 4px;list-style:none;counter-reset:step}
.howto-steps li{
  counter-increment:step;position:relative;padding:0 4px 12px 30px;
  font-size:15px;line-height:1.45;
}
.howto-steps li::before{
  content:counter(step);position:absolute;left:0;top:1px;
  font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;color:var(--accent);
  background:var(--accent-soft);width:20px;height:20px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
}
.howto-watch{
  background:var(--surface-2);border:1px solid var(--line);border-radius:9px;
  padding:10px 12px;margin:4px 4px 12px;font-size:14px;line-height:1.45;
}
.howto-watch b{
  display:block;font-family:"IBM Plex Mono",monospace;font-size:9.5px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:4px;
}
.howto-link{
  display:block;text-align:center;padding:12px;margin:0 4px;border-radius:9px;
  border:1px solid var(--line);color:var(--muted);text-decoration:none;
  font-family:Lato,system-ui,-apple-system,sans-serif;font-size:13.5px;font-weight:600;
}
.howto-link:active{background:var(--surface-2)}
.tag{
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;padding:3px 7px;border-radius:5px;
  background:var(--surface-2);color:var(--muted);border:1px solid var(--line);
}
.tag.side{background:var(--accent-soft);color:var(--accent);border-color:transparent;font-weight:700}
.ex-swap{
  flex:none;width:34px;height:34px;border-radius:9px;
  border:1px solid var(--line);background:var(--surface-2);color:var(--muted);
  display:flex;align-items:center;justify-content:center;
}
.ex-swap:active{background:var(--sunk)}
.ex-swapped .ex-swap{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.ex-swap svg{display:block}
.ex-swapped .ex-name{color:var(--accent)}
.target{
  display:flex;align-items:center;gap:9px;margin:0 13px 11px;padding:8px 11px;
  background:var(--accent-soft);border-radius:9px;
}
.target span{
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--accent);opacity:.75;
}
.target b{
  font-family:"IBM Plex Mono",monospace;font-size:15px;font-weight:600;
  color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:.01em;
}
.target i{
  font-style:normal;margin-left:auto;font-family:"IBM Plex Mono",monospace;
  font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);opacity:.75;
}

.notes{
  background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:12px 13px;margin:14px 0 4px;box-shadow:var(--shadow);
}
.notes label{
  display:block;font-family:"IBM Plex Mono",monospace;font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:7px;
}
.notes textarea{
  width:100%;min-height:64px;resize:vertical;background:var(--surface-2);
  border:1px solid var(--line);border-radius:8px;padding:9px;
  font-family:Lato,system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.4;
}
.notes textarea:focus{border-color:var(--accent);background:var(--surface)}
.hist-notes{
  font-size:12.5px;color:var(--muted);font-style:italic;padding:7px 0 0;
  margin:6px 0 0;border-top:1px dashed var(--line);
}
.hist-top button{
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--faint);padding:3px 6px;border-radius:5px;
  border:1px solid var(--line);
}
.hist-open{cursor:pointer}
.hist-open:active{background:var(--surface-2)}

.sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end}
.sheet-back{position:absolute;inset:0;background:rgba(10,13,15,.55)}
.sheet-panel{
  position:relative;width:100%;max-height:80vh;background:var(--surface);
  border-radius:16px 16px 0 0;border-top:1px solid var(--line);
  display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom);
}
.sheet-head{
  display:flex;align-items:center;gap:10px;padding:14px 16px 10px;
  border-bottom:1px solid var(--line);
}
.sheet-head b{
  flex:1;font-family:Lato,system-ui,-apple-system,sans-serif;font-size:15px;font-weight:700;
  letter-spacing:-.015em;
}
.sheet-head button{
  font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);padding:6px 8px;
}
.sheet-body{overflow-y:auto;padding:8px 10px 16px;-webkit-overflow-scrolling:touch}
.sheet-group{
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--accent);padding:12px 6px 6px;
}
.sheet-item{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  padding:11px 8px;border-radius:8px;font-size:14.5px;
}
.sheet-item:active{background:var(--surface-2)}
.sheet-item em{
  font-style:normal;margin-left:auto;font-family:"IBM Plex Mono",monospace;
  font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;
}
.sheet-item.current{color:var(--accent)}
.sheet-mine{display:flex;align-items:center;gap:6px;padding:5px 8px}
.sheet-mine .pick{
  flex:1;text-align:left;padding:9px 0;font-size:14.5px;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.sheet-mine em{
  font-style:normal;font-family:"IBM Plex Mono",monospace;font-size:11px;
  color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap;
}
.mini{
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--faint);border:1px solid var(--line);
  border-radius:5px;padding:5px 7px;white-space:nowrap;
}
.mini:active{background:var(--surface-2)}
.mini.armed{color:var(--accent);border-color:var(--accent)}
.sheet-custom{display:flex;gap:7px;padding:8px 8px 4px}
.sheet-custom input{
  flex:1;min-height:42px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:8px;padding:0 10px;font-size:15px;
}
.sheet-custom button{
  background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:0 15px;
  font-family:Lato,system-ui,-apple-system,sans-serif;font-weight:600;font-size:14px;
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <h1 class="brand">Over<span>·</span>load</h1>
  </div>
  <nav class="tabs" id="tabs" role="tablist">
    <button class="tab" role="tab" data-view="log" aria-selected="true">Log</button>
    <button class="tab" role="tab" data-view="history" aria-selected="false">History</button>

const HOWTO = {
flat_db_press:{s:["Sit on a flat bench, a dumbbell resting on each thigh.","Lie back, using your knees to kick the bells up to shoulder height.","Press straight up until your arms lock over your chest.","Lower until your elbows drop just past your torso."],w:"Keep elbows about 45° from your ribs. Flaring them to 90° is what wrecks shoulders."},
incline_db_press:{s:["Set the bench to 30-45°.","Lie back with the bells at shoulder height, palms forward.","Press up and slightly back, over your collarbone.","Lower under control until you feel the stretch across your upper chest."],w:"Past 45° the move becomes a shoulder press and your chest stops working."},
squeeze_press:{s:["Lie on a flat bench holding two bells together over your chest, palms facing each other.","Press them into each other hard and keep that pressure the whole set.","Lower to your chest, still squeezing.","Press back up."],w:"The squeeze is the exercise. If the bells drift apart, you are just doing a press."},
pushup_burnout:{s:["Hands under your shoulders, body in one straight line.","Lower until your chest is a fist off the floor.","Push back up, locking out.","Go until your form breaks, not until it hurts."],w:"Hips sagging or piking means the set is over."},
feet_elev_pushup:{s:["Put your feet on a bench, hands on the floor under your shoulders.","Keep a straight line from heels to head.","Lower your chest to the floor.","Press back up."],w:"Higher feet means more load on the upper chest and shoulders. Don't let the hips drop."},
diamond_pushup:{s:["Hands together under your chest, index fingers and thumbs forming a triangle.","Keep elbows tucked close to your ribs.","Lower your chest to your hands.","Press up."],w:"Elbows flaring out turns this back into a normal push-up and drops the triceps out of it."},
close_grip_press:{s:["Lie on a flat bench, EZ bar with hands about shoulder-width on the inner grips.","Press the bar over your lower chest.","Lower with elbows tucked tight to your sides.","Press back up."],w:"Grip narrower than shoulder-width strains the wrists without adding tricep work."},
db_fly:{s:["Lie flat, bells above your chest, palms facing each other.","Keep a soft, fixed bend in the elbows.","Open your arms wide until you feel a stretch across the chest.","Bring them back together over your chest."],w:"The elbow angle never changes. If it bends and straightens, you are pressing."},
incline_db_fly:{s:["Set the bench to 30°.","Start with the bells above your chest, palms facing each other, elbows softly bent.","Open wide until you feel the stretch.","Hug them back together."],w:"Go lighter than feels right. Flyes are a stretch exercise, not a strength one."},
cable_crossover:{s:["Set both pulleys low.","Grab a handle in each hand, step forward into a split stance.","Sweep your hands up and together in front of your chest.","Hold the squeeze for a beat, then lower with control."],w:"Drive with the chest, not the front delts. Hands finish in front of your sternum, not your chin."},
db_pullover:{s:["Lie flat on a bench holding one dumbbell over your chest with both hands under the top plate.","Keep elbows slightly bent.","Lower the bell back over your head until you feel the stretch through your lats.","Pull it back over your chest."],w:"Ribs stay down. Arching your lower back to get more range just loads your spine."},
pullup:{s:["Hang from the bar, palms forward, hands just outside shoulder-width.","Pull your shoulder blades down before your arms bend.","Pull until your chin clears the bar.","Lower all the way to straight arms."],w:"Use the assist machine or a band rather than kipping. Half-reps don't build the back."},
chinup:{s:["Hang with palms facing you, hands shoulder-width.","Pull your elbows down toward your ribs.","Bring your chin over the bar.","Lower under control to a full hang."],w:"Underhand grip pulls the biceps in hard, so expect more reps here than on pull-ups."},
wide_pullup:{s:["Grip well outside shoulder-width, palms forward.","Pull the chest toward the bar, elbows tracking out and down.","Clear the bar with your chin.","Lower to a full hang."],w:"Expect fewer reps than a normal pull-up. Don't chase the same number."},
lat_pulldown:{s:["Set the thigh pad snug so you don't lift off the seat.","Grip wide, palms forward.","Pull the bar to your upper chest, leading with the elbows.","Let it rise back to a full stretch."],w:"Pull to the chest, never behind the neck. Lean back no more than about 15°."},
cs_db_row:{s:["Set an incline bench to about 30° and lie chest-down on it.","Let the bells hang straight down.","Row them to your hips, squeezing the shoulder blades.","Lower to a full stretch."],w:"The bench does the cheating for you. If your chest comes off it, the weight is too heavy."},
single_arm_row:{s:["Put one knee and the same-side hand on a bench.","Let the dumbbell hang from your free hand.","Row it to your hip, elbow tracking past your ribs.","Lower to a full stretch."],w:"Don't rotate your torso to lift the bell. Shoulders stay square to the floor."},
seated_row:{s:["Sit with feet braced, knees slightly bent.","Grab the handle, sit tall with chest up.","Pull to your stomach, driving the elbows straight back.","Let it return until your shoulder blades spread."],w:"Your torso stays upright. Rocking back and forth is your lower back doing the lifting."},
renegade_row:{s:["Get into a push-up position gripping a dumbbell in each hand, feet wide.","Row one bell to your hip while the other braces on the floor.","Lower it under control.","Alternate sides."],w:"Hips must not rotate. If they twist, widen your feet or drop the weight."},
inverted_row:{s:["Set a Smith bar or rack bar at about hip height.","Hang underneath it, body straight, heels on the floor.","Pull your chest to the bar.","Lower to straight arms."],w:"Make it harder by walking your feet out, easier by raising the bar."},
db_shrug:{s:["Stand holding a heavy dumbbell in each hand at your sides.","Shrug straight up toward your ears.","Hold at the top for a full second.","Lower all the way down."],w:"Don't roll your shoulders. Straight up and straight down."},
goblet_squat:{s:["Hold one dumbbell vertically against your chest, both hands under the top plate.","Feet shoulder-width, toes turned slightly out.","Sit down between your heels, keeping your chest tall.","Drive up through mid-foot."],w:"Elbows should brush the inside of your knees at the bottom. If they don't, you aren't deep enough."},
bulgarian:{s:["Stand a stride in front of a bench, dumbbell in each hand.","Rest the top of your back foot on the bench.","Drop straight down until your front thigh is parallel.","Drive up through the front heel."],w:"Keep your weight on the front leg. The back leg is a kickstand, not a pusher."},
walking_lunge:{s:["Stand tall with a dumbbell in each hand.","Step forward and drop your back knee toward the floor.","Push through the front heel to stand.","Step through into the next rep with the other leg."],w:"Front knee tracks over the middle toes. Take a longer step to hit glutes, shorter for quads."},
db_front_squat:{s:["Clean two dumbbells to your shoulders, elbows high, palms facing in.","Feet shoulder-width.","Squat down, keeping your torso upright.","Drive up through your heels."],w:"Elbows dropping pitches you forward. Keep them pointed ahead the whole set."},
db_step_up:{s:["Stand facing a bench or box at about knee height, dumbbell in each hand.","Plant one whole foot on the box.","Drive through that heel to stand fully upright.","Lower under control, don't drop."],w:"Do not push off the bottom foot. All the work comes from the leg on the box."},
reverse_lunge:{s:["Stand tall, dumbbell in each hand.","Step backward and drop the back knee toward the floor.","Keep your weight on the front foot.","Push through the front heel to return."],w:"Easier on the knees than a forward lunge. Step straight back, not out to the side."},
sumo_squat:{s:["Hold one heavy dumbbell hanging between your legs with both hands.","Stand wide, toes turned out about 45°.","Squat straight down, knees tracking over your toes.","Drive up, squeezing the glutes at the top."],w:"Knees caving inward is the whole failure mode. Push them out."},
lateral_lunge:{s:["Stand tall with a dumbbell in each hand, feet together.","Step wide to one side and sit back into that hip.","Keep the trailing leg straight.","Push off the bent leg to return to center."],w:"Both feet stay flat and pointed forward. Sit back into the hip, don't just bend the knee."},
db_rdl:{s:["Stand holding a dumbbell in front of each thigh.","Push your hips back, letting the bells slide down your legs.","Stop when you feel a strong hamstring stretch, around mid-shin.","Drive your hips forward to stand."],w:"Legs stay nearly straight with a soft knee. This is a hip hinge, not a squat."},
single_leg_rdl:{s:["Hold one dumbbell in the hand opposite your standing leg.","Hinge at the hip, letting the free leg swing straight back as a counterweight.","Lower until your torso is near parallel to the floor.","Squeeze the glute to stand."],w:"Hips stay level. If the free-leg hip opens toward the ceiling, you've rotated."},
db_good_morning:{s:["Hold one dumbbell against your upper chest with both hands.","Feet hip-width, soft knees.","Hinge at the hips and lower your torso toward parallel.","Squeeze the glutes to stand tall."],w:"Go light. Your back stays flat the entire time. Round it and you're loading your spine."},
stiff_leg_dl:{s:["Stand holding a dumbbell in front of each thigh, legs nearly straight.","Hinge at the hips and lower the bells down the front of your legs.","Go to the deepest point you can hold a flat back.","Drive the hips forward to stand."],w:"Straighter legs than an RDL, so use less weight and expect more hamstring stretch."},
glute_bridge:{s:["Lie on your back, knees bent, feet flat and close to your butt.","Rest a dumbbell across your hips, held with both hands.","Drive through your heels and lift your hips until your body is a straight line.","Squeeze hard at the top for a second, then lower."],w:"Ribs down and chin tucked. Arching your lower back is not the same as extending your hips."},
hip_thrust:{s:["Sit on the floor with your upper back against a bench, dumbbell across your hips.","Feet flat, shins vertical at the top of the rep.","Drive through your heels until hips are level with knees.","Squeeze the glutes, then lower under control."],w:"Tuck your chin and keep ribs down. The bench should sit just under your shoulder blades."},
leg_curl:{s:["Set the pad just above your heels and the thigh pad snug.","Curl your heels toward your butt as far as they go.","Pause for a beat at the peak.","Let the weight back down slowly, resisting the whole way."],w:"The lowering half is where hamstrings grow. Don't let the stack slam back."},
standing_calf:{s:["Stand with the balls of your feet on a step or plate, heels hanging off.","Hold a dumbbell in each hand at your sides.","Rise as high onto your toes as you can.","Pause a second at the top, then sink into a full stretch."],w:"Bouncing at the bottom uses the tendon, not the muscle. Full stretch, full pause."},
seated_calf:{s:["Sit on a bench with the balls of your feet on a plate or step.","Rest a dumbbell on each knee.","Push up onto your toes as high as possible.","Lower to a deep stretch."],w:"Bent knees shift the work to the soleus, so expect to use less weight than standing."},
single_leg_calf:{s:["Stand on one foot with the ball of that foot on a step.","Hold something for balance, not for support.","Rise as high as you can onto the toe.","Lower into a full stretch below step level."],w:"Balance is the limiter, not strength. Hold the rack lightly with one finger."},
seated_db_press:{s:["Sit on a bench with the back support upright.","Bring the bells to shoulder height, palms facing forward.","Press straight overhead until your arms lock.","Lower to ear level."],w:"Keep your ribs down and don't arch off the bench. Wrists stack over elbows."},
standing_ohp:{s:["Stand with feet hip-width, bells at shoulder height.","Squeeze your glutes and brace your core.","Press overhead, moving your head slightly forward as the bells clear it.","Lower to shoulders under control."],w:"No leg drive. If you're dipping and bouncing, that's a push press."},
arnold_press:{s:["Start with bells at chest height, palms facing you.","As you press up, rotate your palms to face forward.","Lock out overhead.","Reverse the rotation on the way down."],w:"The rotation happens during the press, not before it. Go lighter than a normal press."},
push_press:{s:["Stand with bells at shoulder height.","Dip a few inches at the knees, torso staying vertical.","Explode up, using the leg drive to launch the bells overhead.","Lower back to shoulders."],w:"A short, sharp dip. Bending too deep turns it into a thruster."},
lateral_raise:{s:["Stand with a light dumbbell in each hand at your sides.","Lead with your elbows, raising your arms out to the sides.","Stop at shoulder height, no higher.","Lower slowly."],w:"Everyone goes too heavy here. If you're swinging, halve the weight."},
seated_lateral_raise:{s:["Sit upright on a bench, light bells at your sides.","Raise your arms out to shoulder height, leading with the elbows.","Pause at the top.","Lower under control."],w:"Sitting removes the leg swing, so you'll need less weight than standing. That's the point."},
ez_upright_row:{s:["Hold an EZ bar with hands about shoulder-width.","Pull it straight up the front of your body, elbows leading.","Stop when your hands reach chest height.","Lower under control."],w:"Stop at chest height. Pulling to the chin pinches the shoulder for a lot of people."},
rear_delt_fly:{s:["Hinge at the hips until your torso is near parallel to the floor.","Let light bells hang under your chest, palms facing each other.","Raise them out to the sides, thumbs down.","Squeeze the back of the shoulders, then lower."],w:"Very light weight. If your traps are doing it, you're using too much."},
face_pull:{s:["Set a cable at upper-chest height with a rope attachment.","Grip the rope with both hands, palms facing in, and step back.","Pull toward your forehead, splitting the rope, elbows high and wide.","Return under control."],w:"Elbows stay at or above shoulder height the whole rep. This is the posture fix."},
rear_delt_raise:{s:["Lie chest-down on a bench set to about 30°.","Let light bells hang straight down, palms facing each other.","Raise them out to the sides, thumbs pointed down.","Lower slowly."],w:"The bench stops you from cheating. Keep the weight light and the reps slow."},
ez_curl:{s:["Hold an EZ bar at the angled grips, arms hanging.","Keep elbows pinned at your sides.","Curl to shoulder height.","Lower all the way to straight arms."],w:"Elbows drifting forward turns this into a front raise. Pin them to your ribs."},
hammer_curl:{s:["Stand with a dumbbell in each hand, palms facing your thighs.","Keep that neutral grip the whole rep.","Curl to shoulder height.","Lower under control."],w:"No wrist rotation. The neutral grip is what hits the forearm and brachialis."},
cable_curl:{s:["Set a rope or bar at the lowest pulley.","Stand a step back, elbows at your sides.","Curl up, squeezing at the top.","Lower slowly, keeping tension the whole way."],w:"Cables keep tension at the bottom where dumbbells go slack. Don't let the stack rest."},
incline_curl:{s:["Set a bench to 45° and sit back against it.","Let the bells hang straight down behind your torso.","Curl up without moving your elbows forward.","Lower to a full stretch."],w:"That stretched starting position is the whole point. Don't shrug your shoulders forward."},
concentration_curl:{s:["Sit on a bench, feet wide.","Brace your working elbow against the inside of the same-side thigh.","Curl the bell to your shoulder.","Lower to a full stretch."],w:"The elbow never leaves the thigh. That's what makes it strict."},
ez_21s:{s:["Hold an EZ bar with a shoulder-width grip.","Do 7 reps from full stretch to halfway.","Do 7 reps from halfway to the top.","Do 7 full-range reps."],w:"Use about half your normal curl weight. Set 3 of 21 should be genuinely hard."},
cross_hammer_curl:{s:["Stand with a dumbbell in each hand, neutral grip.","Curl one bell across your body toward the opposite shoulder.","Squeeze at the top.","Lower and alternate."],w:"The elbow stays at your side. Only the forearm crosses the body."},
ez_skullcrusher:{s:["Lie on a flat bench holding an EZ bar over your chest.","Keeping upper arms still, bend at the elbows.","Lower the bar toward your forehead or just behind it.","Extend back up without moving the elbows."],w:"Upper arms stay locked in place. If they swing back, you're pressing."},
oh_tri_ext:{s:["Hold one dumbbell overhead with both hands cupping the top plate.","Keep elbows close to your ears.","Lower the bell behind your head.","Extend back overhead."],w:"Elbows flare out as you fatigue. Keep them narrow or the triceps stop working."},
bench_dip:{s:["Sit on the edge of a bench, hands gripping beside your hips.","Slide your butt off, legs out in front.","Lower until your upper arms are about parallel to the floor.","Press back up."],w:"Don't go deeper than parallel. Below that puts real strain on the shoulder."},
ez_oh_ext:{s:["Sit or stand holding an EZ bar overhead with a narrow grip.","Keep upper arms vertical and close to your head.","Lower the bar behind your head.","Extend back up."],w:"Upper arms stay still and pointed at the ceiling. Only the forearms move."},
tri_kickback:{s:["Hinge at the hips, torso near parallel to the floor.","Pin your upper arm against your side, elbow bent.","Extend the forearm straight back until the arm is locked.","Return under control."],w:"Light weight, full lockout. The squeeze at the end is the entire exercise."},
hanging_knee_raise:{s:["Hang from a bar, arms straight.","Without swinging, pull your knees up toward your chest.","Curl your pelvis up at the top.","Lower slowly under control."],w:"If you're swinging, you're using momentum. Pause at the bottom of each rep."},
hanging_leg_raise:{s:["Hang from a bar with straight arms.","Keep your legs nearly straight.","Raise them until they're at least parallel to the floor.","Lower slowly without swinging."],w:"Much harder than knee raises. Bend the knees slightly if your form breaks down."},
bicycle_crunch:{s:["Lie on your back, hands lightly behind your head, shoulders off the floor.","Bring one knee in and rotate the opposite elbow toward it.","Extend the other leg straight out just above the floor.","Switch sides in a smooth pedaling motion."],w:"Don't yank your neck. Rotate through the ribs, not the arms."},
reverse_crunch:{s:["Lie on your back, hands flat beside your hips.","Bring your knees over your hips.","Curl your pelvis up so your hips leave the floor.","Lower slowly."],w:"Small range. The rep is lifting your hips, not swinging your legs."},
decline_situp:{s:["Hook your feet into a decline bench.","Hold a dumbbell against your chest.","Sit up by rolling the spine, not folding at the hip.","Lower under control."],w:"Don't drop back fast. The lowering half is most of the work."},
flutter_kicks:{s:["Lie on your back, hands under your glutes for support.","Lift both heels a few inches off the floor.","Alternate small, quick kicks up and down.","Keep the lower back pressed to the floor."],w:"If your lower back arches, raise your legs higher until it doesn't."},
v_up:{s:["Lie flat, arms overhead, legs straight.","Simultaneously lift your torso and legs to meet in a V.","Reach for your toes.","Lower everything under control."],w:"Bend the knees if you can't keep your legs straight. Don't sling yourself up."},
toes_to_bar:{s:["Hang from a bar with straight arms.","Pull your shoulder blades down.","Raise straight legs all the way up to touch the bar.","Lower slowly under control."],w:"The hardest core move here. Drop to leg raises if you can't do it without swinging."},
cable_crunch:{s:["Kneel facing a high pulley with a rope, hands beside your head.","Keep hips fixed in place.","Crunch your ribs toward your pelvis, rounding the spine.","Return under control."],w:"Hips do not move. If you're hinging at the hip, you've turned it into a pulldown."},
weighted_leg_raise:{s:["Hang from a bar holding a light dumbbell between your feet.","Raise your legs to parallel or higher.","Pause at the top.","Lower slowly without swinging."],w:"Squeeze the bell hard the whole set so it can't slip."},
hanging_knee_twist:{s:["Hang from a bar, arms straight.","Pull your knees up toward your chest.","At the top, rotate both knees to one side.","Lower under control, alternating sides."],w:"Rotate from the waist, not by swinging your hips."},
oblique_knee_raise:{s:["Hang from a bar, arms straight.","Pull your knees up and toward one shoulder in one motion.","Squeeze the side of your waist at the top.","Lower slowly, then do the other side."],w:"Lead with the hip, not the knee. Keep the upper body still."},
plank:{s:["Forearms on the floor, elbows under your shoulders.","Body in one straight line from heels to head.","Squeeze glutes and brace your abs.","Hold, breathing normally."],w:"Hips sagging or piking up. Tuck your pelvis slightly and squeeze."},
side_plank:{s:["Lie on your side, elbow under your shoulder.","Stack your feet and lift your hips off the floor.","Make a straight line from ankle to head.","Hold, then switch sides."],w:"Don't let the top hip roll forward or the bottom hip sag."},
side_plank_reach:{s:["Set up in a side plank on your forearm.","Reach your top arm straight to the ceiling.","Thread it under your torso, rotating through the ribs.","Return to the ceiling. That's one rep."],w:"Hips stay lifted the whole time. Only the torso rotates."},
copenhagen:{s:["Lie on your side with your top leg resting on a bench at knee or ankle height.","Prop up on your forearm, elbow under the shoulder.","Lift your hips so your body makes a straight line.","Hold, then switch sides."],w:"Start with the knee on the bench, not the ankle. This one is brutally hard at full length."},
hollow_hold:{s:["Lie on your back, arms overhead.","Press your lower back flat into the floor.","Lift your shoulders and legs a few inches off the floor.","Hold that dish shape."],w:"If your lower back lifts off the floor, tuck your knees in until it doesn't."},
hollow_rock:{s:["Get into a hollow hold position.","Keep the shape rigid.","Rock back and forth from shoulders to hips.","Move from the whole body, not by flexing."],w:"If the shape breaks apart while rocking, go back to static holds."},
dead_bug:{s:["Lie on your back, arms straight up, knees over hips at 90°.","Press your lower back into the floor.","Lower one arm overhead and the opposite leg toward the floor.","Return and switch sides."],w:"The lower back must stay flat. The moment it lifts, shorten the range."},
weighted_dead_bug:{s:["Lie on your back holding one dumbbell straight up with both hands.","Knees over hips at 90°.","Keeping the bell steady overhead, extend one leg toward the floor.","Return and alternate."],w:"The bell should not drift. If it wobbles, the weight is too heavy."},
shoulder_taps:{s:["Get into a push-up position, feet wider than usual.","Keeping hips level, lift one hand and tap the opposite shoulder.","Place it back down.","Alternate."],w:"Hips must not rock side to side. Widen your feet if they do."},
plank_up_down:{s:["Start in a forearm plank.","Press up onto one hand, then the other, into a push-up position.","Lower back down to one forearm, then the other.","Alternate which arm leads."],w:"Keep the hips as still as possible. Wide feet make this much easier."},
ab_wheel:{s:["Kneel holding the wheel under your shoulders.","Brace hard and roll forward, keeping your back flat.","Go only as far as you can without your hips sagging.","Pull back using your abs, not your arms."],w:"Range is earned. Start short. A sagging lower back at full extension is how people get hurt."},
bird_dog:{s:["On hands and knees, hands under shoulders, knees under hips.","Extend one arm forward and the opposite leg back.","Hold for a beat, keeping hips square to the floor.","Return and switch sides."],w:"Don't let the hip of the extended leg open toward the ceiling."},
mountain_climber:{s:["Start in a push-up position, hands under shoulders.","Drive one knee toward your chest.","Switch legs quickly, keeping your hips low.","Keep a steady rhythm."],w:"Hips rising turns it into cardio for your shoulders. Keep the body flat."},
russian_twist:{s:["Sit with knees bent, heels light on the floor, torso leaned back about 45°.","Hold a dumbbell at your chest with both hands.","Rotate the bell to one hip, then the other.","Keep your chest up throughout."],w:"Rotate through the ribs, not by swinging your arms side to side."},
woodchop:{s:["Set a cable high with a single handle.","Stand side-on, feet planted wide.","Pull the handle down and across your body toward the opposite hip.","Return under control, then do the other side."],w:"Rotate through the torso with the arms mostly straight. The hips pivot, they don't twist."},
pallof_press:{s:["Set a cable at chest height, stand side-on and grip the handle with both hands at your sternum.","Step out to create tension.","Press your hands straight out in front of you.","Resist the pull toward the machine, then return."],w:"The point is to not rotate. If your torso turns toward the stack, lighten it."},
db_side_bend:{s:["Stand holding one dumbbell at your side, other hand behind your head.","Bend sideways toward the weighted side, letting the bell slide down your leg.","Stop at a comfortable stretch.","Pull straight back up using your side, then switch."],w:"Bend only side to side. Leaning forward or back takes the obliques out of it."},
suitcase_carry:{s:["Pick up one heavy dumbbell at your side, like a suitcase.","Stand tall, shoulders level.","Walk with controlled steps for the set time.","Switch hands and repeat."],w:"Do not lean away from the weight. Staying square is the entire exercise."},
farmer_carry:{s:["Pick up a heavy dumbbell in each hand.","Stand tall, chest up, shoulders back.","Walk with short, controlled steps for the set time.","Set them down under control."],w:"Grip usually fails first. Don't let your shoulders round forward as you tire."}
};

const PATTERN_OF = {};
for(const p in PATTERNS) PATTERNS[p].forEach(id => { PATTERN_OF[id] = p; });
const BLOCKS = ["A","B","C"];
const LS_KEY = "overload.v1";
const LEGACY_LS_KEY = "ironledger.v1";

let db = null;
let sessions = {};
let view = "log";
let current = {date:null, day:null, block:null, blockIndex:0, entries:{}, swaps:{}, notes:""};
let customNames = {};
let saveTimer = null;
let retryTimer = null;
let retryDelay = 0;
let pendingSync = false;
let timerState = {end:0, tick:null};
const RETRYABLE = {unavailable:1, resource_exhausted:1};
const FATAL = {revoked:1, not_granted:1, capability_disabled:1, capability_removed:1};

const ICON_SWAP = '<svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h12M12 4l3 3-3 3"/><path d="M17 13H5m3-3-3 3 3 3"/></svg>';
const ICON_UNDO = '<svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10h9a3.5 3.5 0 010 7H9"/><path d="M4 10l3.5-3.5M4 10l3.5 3.5"/></svg>';

const $ = id => document.getElementById(id);
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const parseISO = s => {const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d);};

function blockIndexOf(session){
  if(!session) return 0;
  return typeof session.blockIndex === "number" ? session.blockIndex : Math.max(0, BLOCKS.indexOf(session.block));
}

function loggedSessions(){
  return Object.keys(sessions).map(d => sessions[d]).filter(s => s && loggedCount(s));
}

function sessionsDoneIn(blockIndex){
  const done = new Set();
  loggedSessions().forEach(s => { if(blockIndexOf(s) === blockIndex) done.add(s.day); });
  return done;
}

function activeBlockIndex(){
  const logged = loggedSessions();
  if(!logged.length) return 0;
  const latest = logged.reduce((a, s) => Math.max(a, blockIndexOf(s)), 0);
  return sessionsDoneIn(latest).size >= DAY_KEYS.length ? latest + 1 : latest;
}

function nextSessionIn(blockIndex){
  const done = sessionsDoneIn(blockIndex);
  return DAY_KEYS.find(k => !done.has(k)) || DAY_KEYS[0];
}

function setBlockIndex(index){
  current.blockIndex = Math.max(0, index);
  current.block = BLOCKS[current.blockIndex % 3];
}


for(const b of BLOCKS) for(const d of DAY_KEYS){
  allExercises(PROGRAM[b][d]).forEach(e => {
    e.load = LOAD_OF[e.id] || (e.bw ? "bw" : "single");
    e.per = PER_OF[e.id] || null;
    e.sides = e.per ? 2 : 1;
    e.implements = LOAD_FACTOR[e.load];
  });
}

function workout(){ return PROGRAM[current.block][current.day]; }

function allExercises(plan){
  if(!plan) return [];
  return plan.ex.concat((plan.core || []).flat());
}

const HEAVY_COMPOUND_SLOTS = 2;
const REST = {heavy:120, accessory:60, betweenMoves:90, supersetWalk:15, supersetRound:45, betweenSupersets:60};

for(const b of BLOCKS) for(const d of DAY_KEYS){
  PROGRAM[b][d].ex.forEach((e, i) => {
    e.rest = i < HEAVY_COMPOUND_SLOTS ? REST.heavy : REST.accessory;
    e.restAfter = REST.betweenMoves;
  });
  (PROGRAM[b][d].core || []).forEach(pair => pair.forEach((e, i) => {
    e.core = 1;
    e.rest = i ? REST.supersetRound : REST.supersetWalk;
    e.restAfter = i ? REST.betweenSupersets : REST.supersetWalk;
  }));
}

function num(v){ const n = parseFloat(v); return isFinite(n) ? n : 0; }
function score(set, bw){
  if(!set || !set.r) return 0;
  return bw ? num(set.r) * (1 + num(set.w)/40) : num(set.w) * num(set.r);
}
function epley(w, r){ return w * (1 + r/30); }

function priorSets(exId, beforeDate){
  const dates = Object.keys(sessions).filter(d => d < beforeDate).sort().reverse();
  for(const d of dates){
    const sets = sessions[d].entries && sessions[d].entries[exId];
    if(sets && sets.some(s => s && s.r)) return {date:d, sets};
  }
  return null;
}

function setsOf(exId){
  if(!current.entries[exId]) current.entries[exId] = [];
  return current.entries[exId];
}

function loggedCount(session){
  let n = 0;
  for(const k in (session.entries||{})) for(const s of session.entries[k]) if(s && s.r) n++;
  return n;
}

function deleteSession(date){
  delete sessions[date];
  writeLocal();
  if(db) db.doc("sessions/" + date).delete().catch(() => {});
  if(date === current.date) loadDate(current.date);
  else render();
}

function sessionVolume(session, block, day){
  const plan = PROGRAM[block] && PROGRAM[block][day];
  const byId = {};
  for(const e of allExercises(plan)) byId[e.id] = e;
  let v = 0;
  for(const k in (session.entries||{})){
    const bw = byId[k] && byId[k].bw;
    const ex = byId[k] || findExercise(k);
    const reach = ex ? (ex.sides || 1) * (ex.implements || 1) : 1;
    for(const s of session.entries[k]) if(s && s.r) v += bw ? 0 : num(s.w) * num(s.r) * reach;
  }
  return Math.round(v);
}

function render(){
  const main = $("main");
  main.innerHTML = "";
  if(view === "log") renderLog(main);
  else if(view === "history") renderHistory(main);
  else renderProgress(main);
  updateFooter();
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.view === view)));
}

function renderLog(main){
  const bar = document.createElement("div");
  bar.className = "daybar";
  const dateEl = document.createElement("input");
  dateEl.type = "date"; dateEl.className = "date-input"; dateEl.value = current.date;
  dateEl.addEventListener("change", () => { if(dateEl.value) loadDate(dateEl.value); });
  const blocks = document.createElement("div");
  blocks.className = "blockset";
  const cycleStart = Math.floor(current.blockIndex / 3) * 3;
  BLOCKS.forEach((b, i) => {
    const btn = document.createElement("button");
    btn.textContent = b;
    btn.setAttribute("aria-pressed", String(b === current.block));
    btn.title = `Week ${b}`;
    btn.addEventListener("click", () => { setBlockIndex(cycleStart + i); queueSave(); render(); });
    blocks.appendChild(btn);
  });
  bar.append(dateEl, blocks);
  main.appendChild(bar);

  const done = sessionsDoneIn(current.blockIndex);
  const days = document.createElement("div");
  days.className = "blockset sessions";
  DAY_KEYS.forEach(k => {
    const btn = document.createElement("button");
    const isDone = done.has(k) && k !== current.day;
    btn.innerHTML = `<span>${DAYS[k].short}</span><small class="${isDone ? "done" : ""}">${isDone ? "done" : ""}</small>`;
    btn.setAttribute("aria-pressed", String(k === current.day));
    btn.addEventListener("click", () => { current.day = k; queueSave(); render(); });
    days.appendChild(btn);
  });
  main.appendChild(days);

  const w = workout();
  const head = document.createElement("div");
  head.className = "dayhead";
  const remaining = DAY_KEYS.length - done.size;
  const progress = remaining > 0 ? `${remaining} left this week` : "week complete";
  head.innerHTML = `<p class="eyebrow"><b>Week ${current.block}</b> · Cycle ${Math.floor(current.blockIndex / 3) + 1} · ${progress}</p><h2>${w.focus}</h2><p>${w.cue}</p>`;
  main.appendChild(head);

  const legend = document.createElement("div");
  legend.className = "legend";
  legend.innerHTML = `<span><em class="ghost">45</em> last time</span><span><em class="up">▲</em> beat it</span><span><em class="same">=</em> matched</span>`;
  main.appendChild(legend);

  w.ex.forEach((slot, i) => main.appendChild(exerciseCard(resolveSlot(slot), i + 1, slot)));

  if(w.core){
    const label = document.createElement("p");

    main.appendChild(label);
    w.core.forEach((pair, i) => main.appendChild(corePairCard(pair.map(resolveSlot), i, pair)));
  }

  main.appendChild(notesCard());
}

let swapSlot = null;

function openSwapSheet(slot){
  swapSlot = slot;
  const sheet = $("sheet");
  const body = $("sheetbody");
  $("sheettitle").textContent = "Instead of " + slot.n;
  body.innerHTML = "";

  const pattern = PATTERN_OF[slot.id];
  const pick = id => { swapTo(slot, id); closeSheet(); };

  const addGroup = text => {
    const h = document.createElement("p");
    h.className = "sheet-group";
    h.textContent = text;
    body.appendChild(h);
  };

  const addItem = (id, name) => {
    const btn = document.createElement("button");
    btn.className = "sheet-item" + (id === slot.id ? " current" : "");
    const last = priorSets(id, current.date);
    const done = last ? last.sets.filter(v => v && v.r).length : 0;
    btn.innerHTML = `<span>${name}</span>${done ? `<em>${last.date.slice(5)}</em>` : ""}`;
    btn.addEventListener("click", () => pick(id));
    body.appendChild(btn);
  };

  const mine = Object.keys(customNames).sort((a, b) => customNames[a].localeCompare(customNames[b]));
  if(mine.length){
    addGroup("Your exercises");
    mine.forEach(id => {
      const row = document.createElement("div");
      row.className = "sheet-mine";
      const use = document.createElement("button");
      use.className = "pick" + (id === slot.id ? " current" : "");
      use.textContent = customNames[id];
      use.addEventListener("click", () => pick(id));
      const last = priorSets(id, current.date);
      const when = document.createElement("em");
      when.textContent = last ? last.date.slice(5) : "";
      const edit = document.createElement("button");
      edit.className = "mini";
      edit.textContent = "rename";
      edit.addEventListener("click", () => renameCustom(id));
      const drop = document.createElement("button");
      drop.className = "mini";
      drop.textContent = "remove";
      drop.addEventListener("click", () => {
        const n = setsLoggedFor(id);
        if(drop.dataset.armed){ removeCustom(id); return; }
        drop.dataset.armed = "1";
        drop.className = "mini armed";
        drop.textContent = n ? `drop ${n} sets?` : "sure?";
        setTimeout(() => {
          delete drop.dataset.armed;
          drop.className = "mini";
          drop.textContent = "remove";
        }, 4000);
      });
      row.append(use, when, edit, drop);
      body.appendChild(row);
    });
  }

  if(pattern){
    addGroup("Same movement · " + pattern);
    PATTERNS[pattern].forEach(id => addItem(id, exerciseName(id)));
  }

  addGroup("Type your own");
  const row = document.createElement("div");
  row.className = "sheet-custom";
  const input = document.createElement("input");
  input.type = "text";
  input.placeholder = "Exercise name";
  const go = document.createElement("button");
  go.textContent = "Use";
  const useCustom = () => {
    const name = input.value.trim();
    if(!name) return;
    const id = customIdFor(name);
    if(!id) return;
    if(!findExercise(id) && !customNames[id]){ customNames[id] = name; writeCustom(); }
    pick(id);
  };
  go.addEventListener("click", useCustom);
  input.addEventListener("keydown", e => { if(e.key === "Enter") useCustom(); });
  row.append(input, go);
  body.appendChild(row);

  addGroup("Everything else");
  Object.keys(PATTERNS).filter(p => p !== pattern).forEach(p => {
    addGroup(p);
    PATTERNS[p].forEach(id => addItem(id, exerciseName(id)));
  });

  sheet.hidden = false;
  body.scrollTop = 0;
}

function swapTo(slot, id){
  if(id === slot.id) delete current.swaps[slot.id];
  else current.swaps[slot.id] = id;
  queueSave();
  render();
}

function closeSheet(){ $("sheet").hidden = true; }

function corePairCard(pair, index, slots){

function fillCard(card, ex, num, slot){
  slot = slot || ex;
  const prior = priorSets(ex.id, current.date);
  const unit = ex.unit === "sec" ? "sec" : "reps";
  const suffix = ex.unit === "sec" ? "s" : "";

  const head = document.createElement("div");
  head.className = "ex-head";
  const badge = num ? `<span class="ex-num">${String(num).padStart(2, "0")}</span>` : "";
  head.innerHTML = `${badge}<h3 class="ex-name">${ex.n}</h3>`;
  head.querySelector(".ex-name").addEventListener("click", () => openHowTo(ex));

  const swapBtn = document.createElement("button");
  swapBtn.className = "ex-swap";
  swapBtn.title = ex.swappedFrom ? "Undo swap" : "Swap exercise";
  swapBtn.setAttribute("aria-label", swapBtn.title);
  swapBtn.innerHTML = ex.swappedFrom ? ICON_UNDO : ICON_SWAP;
  swapBtn.addEventListener("click", () => {
    if(ex.swappedFrom){ delete current.swaps[ex.swappedFrom]; queueSave(); render(); }
    else openSwapSheet(slot);
  });
  head.appendChild(swapBtn);
  if(ex.swappedFrom) card.classList.add("ex-swapped");
  card.appendChild(head);

  const meta = document.createElement("div");
  meta.className = "meta";
  if(ex.per) meta.innerHTML += `<span class="tag side">per ${ex.per}</span>`;
  meta.innerHTML += `<span class="tag">${LOAD_LABEL[ex.load]}</span>`;
  meta.innerHTML += `<span>${ex.s} × ${ex.r}${suffix}</span><span class="dot">·</span><span>rest ${ex.rest}s</span>`;
  card.appendChild(meta);

  const target = suggestTarget(ex, prior);
  if(target){
    const row = document.createElement("div");
    row.className = "target";
    row.innerHTML = `<span>go for</span><b>${target.label}</b><i>${target.why}</i>`;
    card.appendChild(row);
  }

  const sets = document.createElement("div");
  sets.className = "sets";
  const logged = setsOf(ex.id);

  const colHead = document.createElement("div");
  colHead.className = "set head";
  colHead.innerHTML = `<div>#</div><div>weight (lbs)</div><div></div><div>${unit}</div><div></div>`;
  sets.appendChild(colHead);

  for(let i = 0; i < ex.s; i++){
    const row = document.createElement("div");
    row.className = "set";
    const last = prior && prior.sets[i];

    const n = document.createElement("div");
    n.className = "set-n";
    n.textContent = i + 1;

    const wIn = document.createElement("input");
    wIn.type = "text"; wIn.inputMode = "decimal";
    wIn.placeholder = last && last.w ? last.w : (ex.bw ? "BW" : "wt");
    wIn.value = (logged[i] && logged[i].w) || "";
    wIn.setAttribute("aria-label", `${ex.n} set ${i+1} weight`);

    const x = document.createElement("div");
    x.className = "x"; x.textContent = "×";

    const rIn = document.createElement("input");
    rIn.type = "text"; rIn.inputMode = "numeric";
    rIn.placeholder = last && last.r ? last.r : unit;
    rIn.value = (logged[i] && logged[i].r) || "";
    rIn.setAttribute("aria-label", `${ex.n} set ${i+1} reps`);

    const delta = document.createElement("div");
    delta.className = "delta";

    const paint = () => {
      wIn.classList.toggle("filled", !!wIn.value);
      rIn.classList.toggle("filled", !!rIn.value);
      n.classList.toggle("done", !!rIn.value);
      const cur = {w:wIn.value.trim(), r:rIn.value.trim()};
      if(!cur.r){ delta.className = "delta none"; delta.textContent = last ? "—" : ""; return; }
      if(!last || !last.r){ delta.className = "delta up"; delta.textContent = "new"; return; }
      const now = score(cur, ex.bw), then = score(last, ex.bw);
      if(now > then){ delta.className = "delta up"; delta.textContent = "▲"; }
      else if(now === then){ delta.className = "delta same"; delta.textContent = "="; }
      else { delta.className = "delta down"; delta.textContent = "▼"; }
    };

    const commit = () => {
      const arr = setsOf(ex.id);
      while(arr.length <= i) arr.push({w:"",r:""});
      const hadReps = !!arr[i].r;
      arr[i] = {w:wIn.value.trim(), r:rIn.value.trim()};
      paint();
      updateFooter();
      queueSave();
      if(!hadReps && arr[i].r) startTimer(i + 1 >= ex.s ? ex.restAfter : ex.rest);
    };

    wIn.addEventListener("input", paint);
    rIn.addEventListener("input", paint);
    wIn.addEventListener("change", commit);
    rIn.addEventListener("change", commit);
    wIn.addEventListener("blur", commit);
    rIn.addEventListener("blur", commit);

    paint();
    row.append(n, wIn, x, rIn, delta);
    sets.appendChild(row);
  }

  card.appendChild(sets);

  if(prior){
    const foot = document.createElement("p");
    foot.className = "ex-cue";
    foot.style.paddingTop = "0";
    const summary = prior.sets.filter(s => s && s.r).map(s => s.w ? `${s.w}×${s.r}${suffix}` : `${s.r}${suffix}`).join("  ");
    foot.textContent = `${prior.date} — ${summary}`;
    card.appendChild(foot);
  }
}

function renderHistory(main){

    const card = document.createElement("div");

      loadDate(d);
      view = "log";
      render();
      window.scrollTo(0, 0);
    });

    card.innerHTML = `<div class="hist-top">
        <h3>${plan.focus}</h3>

        <span class="chip live">${s.block}</span>

    del.textContent = "delete";
    del.addEventListener("click", e => {
      e.stopPropagation();
      if(del.dataset.armed){ deleteSession(d); return; }
      del.dataset.armed = "1";
      del.textContent = "sure?";
      setTimeout(() => { delete del.dataset.armed; del.textContent = "delete"; }, 4000);
    });
    card.querySelector(".hist-top").appendChild(del);

      const swapped = s.swaps && s.swaps[ex.id];

function importSessions(e){
  const file = e.target.files && e.target.files[0];
  e.target.value = "";
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let incoming;
    try{ incoming = JSON.parse(reader.result); }
    catch(err){ setStatus("bad file"); return; }
    if(!incoming || typeof incoming !== "object"){ setStatus("bad file"); return; }
    let merged = 0;
    for(const d in incoming){
      const s = incoming[d];
      if(!s || !s.entries || !s.day || !s.block) continue;
      if(!sessions[d] || loggedCount(s) > loggedCount(sessions[d])){ sessions[d] = s; merged++; }
    }
    writeLocal();
    if(db) for(const d in sessions) db.doc("sessions/" + d).set(sessions[d]).catch(() => {});
    loadDate(current.date);
    setStatus(`merged ${merged}`);
  };
  reader.onerror = () => setStatus("read failed");
  reader.readAsText(file);
}

function renderProgress(main){
  const byEx = {};
  Object.keys(sessions).sort().forEach(d => {
    const s = sessions[d];
    for(const id in (s.entries || {})){
      const sets = s.entries[id].filter(v => v && v.r);
      if(!sets.length) continue;
      const meta = findExercise(id);
      if(!meta) continue;
      const top = sets.reduce((a,b) => score(b, meta.bw) > score(a, meta.bw) ? b : a);
      const val = meta.bw ? num(top.r) : Math.round(epley(num(top.w), num(top.r)));
      (byEx[id] = byEx[id] || {name:meta.n, bw:meta.bw, points:[]}).points.push({d, val, top});
    }
  });

  const ids = Object.keys(byEx).sort((a,b) => byEx[b].points.length - byEx[a].points.length);
  if(!ids.length){
    main.innerHTML = `<p class="empty">Log two sessions of the same lift and the trend line shows up here.</p>`;
    return;
  }
  const label = document.createElement("p");
  label.className = "section-label";
  label.textContent = "Top set trend · est. 1RM";
  main.appendChild(label);

  ids.forEach(id => {
    const e = byEx[id];
    const card = document.createElement("div");
    card.className = "prog";
    const latest = e.points[e.points.length-1];
    const best = e.points.reduce((a,b) => b.val > a.val ? b : a);
    const unit = e.bw ? "reps" : "lb";
    card.innerHTML = `<h3>${e.name}</h3>
      <div class="best">${latest.val} ${unit}</div>
      <div class="meta">${e.points.length} sessions · best ${best.val}</div>
      <div class="meta" style="text-align:right">${latest.top.w ? latest.top.w + "×" : ""}${latest.top.r} on ${latest.d.slice(5)}</div>`;
    if(e.points.length > 1) card.appendChild(sparkline(e.points.map(p => p.val)));
    main.appendChild(card);
  });
}

function sparkline(vals){
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", "0 0 100 36");
  svg.setAttribute("preserveAspectRatio", "none");
  const min = Math.min(...vals), max = Math.max(...vals), span = max - min || 1;
  const pts = vals.map((v,i) => [ (i/(vals.length-1))*100, 32 - ((v-min)/span)*28 ]);
  const area = document.createElementNS(ns, "polygon");
  area.setAttribute("points", `0,36 ${pts.map(p => p.join(",")).join(" ")} 100,36`);
  area.setAttribute("fill", "var(--accent-soft)");
  const line = document.createElementNS(ns, "polyline");
  line.setAttribute("points", pts.map(p => p.join(",")).join(" "));
  line.setAttribute("fill", "none");
  line.setAttribute("stroke", "var(--accent)");
  line.setAttribute("stroke-width", "1.5");
  line.setAttribute("vector-effect", "non-scaling-stroke");
  line.setAttribute("stroke-linejoin", "round");
  const dot = document.createElementNS(ns, "circle");
  dot.setAttribute("cx", pts[pts.length-1][0]);
  dot.setAttribute("cy", pts[pts.length-1][1]);
  dot.setAttribute("r", "2.5");
  dot.setAttribute("fill", "var(--accent)");
  dot.setAttribute("vector-effect", "non-scaling-stroke");
  svg.append(area, line, dot);
  return svg;
}

function readCustom(){
  try{ return JSON.parse(localStorage.getItem(CUSTOM_KEY) || "{}"); }catch(e){ return {}; }
}

function writeCustom(){
  try{ localStorage.setItem(CUSTOM_KEY, JSON.stringify(customNames)); }catch(e){}
}

const squash = t => String(t).toLowerCase().replace(/[^a-z0-9]/g, "");

function programIds(){
  const out = [];
  for(const p in PATTERNS) PATTERNS[p].forEach(id => out.push(id));
  return out;
}

function customIdFor(name){
  const target = squash(name);
  if(!target) return null;
  for(const id in customNames) if(squash(customNames[id]) === target) return id;
  for(const id of programIds()) if(squash(exerciseName(id)) === target) return id;
  return "custom_" + name.toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "");
}

function setsLoggedFor(id){
  let n = 0;
  for(const d in sessions){
    const arr = (sessions[d].entries || {})[id];
    if(arr) n += arr.filter(v => v && v.r).length;
  }
  return n;
}

function renameCustom(id){
  const next = prompt("Rename this exercise", customNames[id] || "");
  if(next === null) return;
  const name = next.trim();
  if(!name) return;
  customNames[id] = name;
  writeCustom();
  render();
  openSwapSheet(swapSlot);
}

function removeCustom(id){
  delete customNames[id];
  writeCustom();
  for(const d in sessions){
    const s = sessions[d];
    if(s.entries && s.entries[id]) delete s.entries[id];
    if(s.swaps) for(const k in s.swaps) if(s.swaps[k] === id) delete s.swaps[k];
    if(!loggedCount(s)) delete sessions[d];
  }
  for(const k in current.swaps) if(current.swaps[k] === id) delete current.swaps[k];
  delete current.entries[id];
  writeLocal();
  if(db) for(const d in sessions) db.doc("sessions/" + d).set(sessions[d]).catch(() => {});
  render();
  openSwapSheet(swapSlot);
}

function exerciseName(id){
  const known = findExercise(id);
  return known ? known.n : (customNames[id] || id);
}

function resolveSlot(slot){
  const subId = current.swaps[slot.id];
  if(!subId || subId === slot.id) return slot;
  const known = findExercise(subId);
  return Object.assign({}, slot, {
    id: subId,
    n: exerciseName(subId),
    bw: known ? known.bw : slot.bw,
    unit: known ? known.unit : slot.unit,
    swappedFrom: slot.id
  });
}

function repRange(r){
  const span = /(\d+)\s*-\s*(\d+)/.exec(r);
  if(span) return {min:+span[1], max:+span[2]};
  const one = /^(\d+)/.exec(r);
  return one ? {min:+one[1], max:+one[1]} : null;
}

function suggestTarget(ex, prior){
  if(!prior) return null;
  const sets = prior.sets.filter(v => v && v.r);
  if(!sets.length) return null;
  const top = sets.reduce((a, b) => score(b, ex.bw) > score(a, ex.bw) ? b : a);
  const topR = num(top.r), topW = num(top.w);
  const unit = ex.unit === "sec" ? "s" : "";
  if(!topW) return {label:`${topR + 1}${unit || " reps"}`, why:"add a rep"};
  const range = repRange(ex.r);
  if(!range) return {label:`${topW}×${topR + 1}${unit}`, why:"add a rep"};
  const allTopped = sets.length >= 2 && sets.every(v => num(v.r) >= range.max);
  if(allTopped || topR > range.max) return {label:`${topW + 5}×${range.min}${unit}`, why:"add weight"};
  return {label:`${topW}×${Math.min(topR + 1, range.max)}${unit}`, why:"add a rep"};
}

function findExercise(id){
  for(const b of BLOCKS) for(const d of DAY_KEYS){
    const hit = allExercises(PROGRAM[b][d]).find(e => e.id === id);
    if(hit) return hit;
  }
  return null;
}

function updateFooter(){
  const w = PROGRAM[current.block] && PROGRAM[current.block][current.day];
  const vol = sessionVolume(current, current.block, current.day);
  const n = loggedCount(current);
  $("volume").textContent = vol ? `${vol.toLocaleString()} lb` : (n ? `${n} sets` : "0");
  const prev = previousSameWorkout();
  if(!n){ $("volnote").textContent = "no sets logged"; return; }
  if(prev){
    const pv = sessionVolume(prev.s, prev.s.block, prev.s.day);
    const diff = vol - pv;
    $("volnote").textContent = pv ? `${diff >= 0 ? "+" : ""}${diff.toLocaleString()} vs ${prev.d.slice(5)}` : `${n} sets logged`;
  } else {
    $("volnote").textContent = `${n} sets logged`;
  }
}

function previousSameWorkout(){
  const dates = Object.keys(sessions).filter(d => d < current.date).sort().reverse();
  for(const d of dates){
    if(sessions[d].day === current.day && sessions[d].block === current.block) return {d, s:sessions[d]};
  }
  return null;
}

function migrateDayKeys(store){
  for(const d in store){
    const s = store[d];
    if(s && LEGACY_DAYS[s.day]) s.day = LEGACY_DAYS[s.day];
  }
  return store;
}

function cleanEntries(entries){
  const out = {};
  for(const k in entries){
    const arr = entries[k].map(s => ({w:(s.w||"").trim(), r:(s.r||"").trim()}));
    while(arr.length && !arr[arr.length-1].r && !arr[arr.length-1].w) arr.pop();
    if(arr.length) out[k] = arr;
  }
  return out;
}

function snapshot(){
  const snap = {date:current.date, day:current.day, block:current.block, blockIndex:current.blockIndex, entries:cleanEntries(current.entries)};
  if(current.notes && current.notes.trim()) snap.notes = current.notes.trim();
  if(Object.keys(current.swaps).length) snap.swaps = Object.assign({}, current.swaps);
  return snap;
}

function setSync(text, live){
  const chip = $("syncchip");
  if(!chip) return;
  chip.textContent = text;
  chip.className = live ? "chip live" : "chip";
}

function setStatus(text, busy){
  $("status").textContent = text;
  $("status").className = busy ? "status saving" : "status";
}

function queueSave(){
  const snap = snapshot();
  sessions[current.date] = snap;
  if(!loggedCount(snap)) delete sessions[current.date];
  writeLocal();
  pendingSync = true;
  setStatus("…", true);
  clearTimeout(saveTimer);
  saveTimer = setTimeout(pushRemote, 1200);
}

function flushNow(){
  const el = document.activeElement;
  if(el && el.tagName === "INPUT") el.blur();
  writeLocal();
  clearTimeout(saveTimer);
  if(pendingSync) pushRemote();
}

document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "hidden") flushNow();
  else if(pendingSync) pushRemote();
});
window.addEventListener("pagehide", flushNow);

function writeLocal(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(sessions)); }catch(e){}
}

function readLocal(){
  try{ return migrateDayKeys(JSON.parse(localStorage.getItem(LS_KEY) || localStorage.getItem(LEGACY_LS_KEY) || "{}")); }catch(e){ return {}; }
}

async function pushRemote(){
  if(!db){ setStatus("saved on device"); return; }
  const snap = snapshot();
  const date = current.date;
  clearTimeout(retryTimer);
  try{
    if(loggedCount(snap)) await db.doc("sessions/" + date).set(snap);
    else await db.doc("sessions/" + date).delete();
    pendingSync = false;
    retryDelay = 0;
    setStatus("synced");
  }catch(e){
    const code = e && e.code;
    if(RETRYABLE[code]){
      retryDelay = Math.min(retryDelay ? retryDelay * 2 : 3000, 60000);
      setStatus("retrying", true);
      retryTimer = setTimeout(pushRemote, retryDelay + Math.random() * 1000);
      return;
    }
    if(FATAL[code]){
      db = null;
      setSync("this device only");
    }
    setStatus("saved on device");
  }
}

function loadDate(dateStr){
  current.date = dateStr;
  const saved = sessions[dateStr];
  if(saved && loggedCount(saved)){
    setBlockIndex(blockIndexOf(saved));
    current.day = saved.day;
  } else {
    setBlockIndex(activeBlockIndex());
    current.day = nextSessionIn(current.blockIndex);
  }
  current.entries = {};
  current.swaps = saved && saved.swaps ? Object.assign({}, saved.swaps) : {};
  current.notes = (saved && saved.notes) || "";
  if(saved && saved.entries) for(const k in saved.entries) current.entries[k] = saved.entries[k].map(s => ({w:s.w||"", r:s.r||""}));
  render();
}

function startTimer(secs){
  timerState.default = secs || 90;
  timerState.end = Date.now() + timerState.default*1000;
  $("timer").classList.add("running");
  clearInterval(timerState.tick);
  timerState.tick = setInterval(tickTimer, 250);
  tickTimer();
}

function stopTimer(){
  clearInterval(timerState.tick);
  timerState.end = 0;
  $("timer").classList.remove("running");
  $("clock").textContent = `${timerState.default || 90}s`;
}

function tickTimer(){
  const left = Math.max(0, Math.round((timerState.end - Date.now())/1000));
  $("clock").textContent = `${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}`;
  if(left === 0){
    clearInterval(timerState.tick);
    $("timer").classList.remove("running");
    if(navigator.vibrate) navigator.vibrate([200,100,200]);
    setTimeout(() => { if(!timerState.end || Date.now() > timerState.end) $("clock").textContent = `${timerState.default || 90}s`; }, 3000);
    timerState.end = 0;
  }
}

$("timer").addEventListener("click", () => { timerState.end ? stopTimer() : startTimer(timerState.default); });
$("sheetclose").addEventListener("click", closeSheet);
$("sheetback").addEventListener("click", closeSheet);
document.addEventListener("keydown", e => { if(e.key === "Escape" && !$("sheet").hidden) closeSheet(); });
$("tabs").addEventListener("click", e => {
  const t = e.target.closest(".tab");
  if(!t) return;
  view = t.dataset.view;
  render();
});

customNames = readCustom();
sessions = readLocal();
loadDate(iso(new Date()));

if("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));

const cloud = typeof claude !== "undefined" && claude && typeof claude.use === "function"
  ? claude.use("db")
  : Promise.resolve(null);

cloud.then(async store => {
  if(!store) return;
  db = store;
  setSync("syncing");
  try{
    const snap = await db.collection("sessions").orderBy("date","desc").limit(400).get();
    const remote = {};
    snap.docs.forEach(d => { const v = d.data(); if(v && v.date) remote[v.date] = v; });
    migrateDayKeys(remote);
    const local = readLocal();
    sessions = Object.assign({}, remote);
    for(const d in local){
      if(!remote[d] || loggedCount(local[d]) > loggedCount(remote[d])) sessions[d] = local[d];
    }
    writeLocal();
    setSync("synced", true);
    loadDate(current.date);
    for(const d in sessions){
      if(!remote[d] || sessions[d] !== remote[d]) db.doc("sessions/" + d).set(sessions[d]).catch(() => {});
    }
  }catch(e){
    setSync("this device");
  }
});
</script>
</body>
</html>
